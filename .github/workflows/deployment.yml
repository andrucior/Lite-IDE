name: Build and push docker images

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER }}/lite-ide-backend:latest \
            -f ./backend/Dockerfile ./backend

      - name: Push backend
        run: |
          docker push ghcr.io/${{ env.OWNER }}/lite-ide-backend:latest

      - name: Build frontend
        run: |
          docker build \
            -t ghcr.io/${{ env.OWNER }}/lite-ide-frontend:latest \
            -f ./frontend/Dockerfile ./frontend

      - name: Push frontend
        run: |
          docker push ghcr.io/${{ env.OWNER }}/lite-ide-frontend:latest