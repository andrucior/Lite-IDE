name: Build and push docker images
on:
  push:
    branches: [ "main" ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build backend image
      - name: Build backend
        run: docker build -t ${{ env.REGISTRY }}/backend/lite-ide-backend:latest -f ./backend/Dockerfile ./backend

      # Push backend image
      - name: Push backend
        run: docker push ${{ env.REGISTRY }}/backend/lite-ide-backend:latest

      # Build frontend image
      - name: Build frontend
        run: docker build -t ${{ env.REGISTRY }}/backend/lite-ide-frontend:latest -f ./frontend/Dockerfile ./frontend

      # Push frontend image
      - name: Push frontend
        run: docker push ${{ env.REGISTRY }}/backend/lite-ide-frontend:latest