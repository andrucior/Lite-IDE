services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      DB_URL: postgresql://liteide:liteide@postgres:5432/liteide
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: lite-ide-postgres
    environment:
      POSTGRES_USER: liteide
      POSTGRES_PASSWORD: liteide
      POSTGRES_DB: liteide
      LANG: C.UTF-8
    ports:
      - "5434:5432"
    volumes:
      - lite-ide-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteide -d liteide"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  lite-ide-pgdata: